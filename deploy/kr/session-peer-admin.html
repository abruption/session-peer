<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Session Peer 릴레이</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#f4f6f8; color:#172033; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; }
      main { width:min(1040px, calc(100% - 32px)); margin:0 auto; padding:48px 0 72px; }
      header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:28px; }
      h1 { margin:0 0 8px; font-size:clamp(28px, 4vw, 42px); letter-spacing:-.04em; }
      p { margin:0; color:#637087; }
      a { color:#2167d5; text-decoration:none; }
      .status { display:inline-flex; align-items:center; gap:8px; padding:9px 13px; border-radius:999px; background:#fff; border:1px solid #dce2ea; font-weight:700; }
      .dot { width:9px; height:9px; border-radius:50%; background:#d18b00; }
      .healthy .dot { background:#15945a; }
      .unhealthy .dot { background:#d63b45; }
      .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; }
      section { background:#fff; border:1px solid #dce2ea; border-radius:18px; padding:22px; box-shadow:0 8px 28px rgba(35, 48, 73, .06); }
      h2 { margin:0 0 18px; font-size:15px; color:#59667c; }
      dl { margin:0; display:grid; gap:14px; }
      dl div { display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
      dt { color:#637087; }
      dd { margin:0; font-size:22px; font-weight:750; font-variant-numeric:tabular-nums; }
      footer { display:flex; justify-content:space-between; gap:16px; margin-top:24px; font-size:13px; color:#778398; }
      @media (max-width:760px) { header { flex-direction:column; } .grid { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Session Peer 릴레이</h1><p>Authelia로 보호되는 식별 정보 없는 운영 지표입니다.</p></div>
        <div id="health" class="status"><span class="dot"></span><span>확인 중</span></div>
      </header>
      <div class="grid">
        <section><h2>가입</h2><dl><div><dt>모드</dt><dd id="signup-mode">—</dd></div><div><dt>등록 사용자</dt><dd id="registered-users">—</dd></div><div><dt>공개 가입</dt><dd id="public-users">—</dd></div><div><dt>대기</dt><dd id="pending-signups">—</dd></div></dl></section>
        <section><h2>기기</h2><dl><div><dt>전체</dt><dd id="devices-total">—</dd></div><div><dt>활성</dt><dd id="devices-active">—</dd></div><div><dt>폐기</dt><dd id="devices-revoked">—</dd></div></dl></section>
        <section><h2>작업</h2><dl><div><dt>전체</dt><dd id="operations-total">—</dd></div><div><dt>완료</dt><dd id="operations-committed">—</dd></div><div><dt>대기</dt><dd id="operations-pending">—</dd></div><div><dt>상태 리비전</dt><dd id="revision">—</dd></div></dl></section>
      </div>
      <footer><span id="updated">아직 갱신되지 않음</span><a href="/">관리 홈으로</a></footer>
    </main>
    <script>
      const ids = (id, value) => { document.getElementById(id).textContent = String(value); };
      async function refresh() {
        const health = document.getElementById('health');
        try {
          const response = await fetch('/session-peer/api/metrics', { credentials:'same-origin', cache:'no-store' });
          if (!response.ok) throw new Error(String(response.status));
          const m = await response.json();
          health.className = 'status ' + (m.serviceHealthy ? 'healthy' : 'unhealthy');
          health.lastElementChild.textContent = m.serviceHealthy ? '정상' : '점검 필요';
          ids('signup-mode', m.signup.mode === 'open' ? '공개' : '닫힘');
          ids('registered-users', m.signup.registeredUsers);
          ids('public-users', m.signup.publicUsers);
          ids('pending-signups', m.signup.pendingReservations);
          ids('devices-total', m.devices.total); ids('devices-active', m.devices.active); ids('devices-revoked', m.devices.revoked);
          ids('operations-total', m.operations.total); ids('operations-committed', m.operations.committed); ids('operations-pending', m.operations.pending);
          ids('revision', m.stateRevision);
          ids('updated', '마지막 갱신 ' + new Date(m.generatedAt).toLocaleString('ko-KR'));
        } catch {
          health.className = 'status unhealthy'; health.lastElementChild.textContent = '불러오기 실패';
        }
      }
      refresh(); setInterval(refresh, 30000);
    </script>
  </body>
</html>

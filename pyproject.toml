[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-peer"
dynamic = ["version"]
description = "Message coding agent sessions locally and over SSH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "YEONGUK LEE", email = "hashcode@kakao.com" },
]
keywords = ["claude-code", "codex", "ssh", "cli", "cross-session", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/abruption/session-peer"
Repository = "https://github.com/abruption/session-peer"
Issues = "https://github.com/abruption/session-peer/issues"

[project.optional-dependencies]
relay = ["websockets>=17.1,<18; python_version >= '3.11'", "cryptography>=50,<51; python_version >= '3.11'"]
mcp = ["mcp>=1.12,<2; python_version >= '3.10'"]

[project.scripts]
session-peer = "session_peer:main"
session-peer-mcp = "session_peer_mcp:main"

[tool.hatch.version]
path = "session_peer.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
exclude = ["/experiments"]
include = ["session_peer_relay", "session_peer.py", "session_peer_mcp.py", "LICENSE", "SECURITY.md", "README.md", "README.ko.md", "README.ja.md", "README.zh-CN.md", "docs/cli-reference.md", "docs/download-metrics.md", "docs/releases/v0.9.0.md", "docs/mcp.md", "docs/wake.md", "docs/multi-home-list.md", "docs/agent-adapters.md", "docs/paired-devices.md", "docs/relay-development-plan.md", "docs/relay-public-pilot-2026-09-17.md", "deploy/session-peer-relay.service", "docs/antigravity.md", "docs/validation/85-antigravity.md", "docs/architecture/agent-transports.md", "plugins", ".agents/plugins/marketplace.json"]

[tool.hatch.build.targets.wheel]
only-include = ["session_peer_relay", "session_peer.py", "session_peer_mcp.py"]

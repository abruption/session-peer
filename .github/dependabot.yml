# Version updates are reviewed PRs; this does not enable auto-merge.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directory: /.github/requirements
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /control
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch

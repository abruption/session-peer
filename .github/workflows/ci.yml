name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relay-control:
    name: optional relay control (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: control/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: control
      - run: npm run typecheck
        working-directory: control
      - run: npm test
        working-directory: control
      - run: npm audit --omit=dev
        working-directory: control
      - run: python -m pip install '.[relay]'
      - name: Actual Node and Python contract integration
        env:
          SESSION_PEER_CONTROL_INTEGRATION: '1'
        run: python -m unittest discover -s tests/control_integration -t . -v

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises; macOS is half the fleet.
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test-only source verification dependency
        run: python -m pip install --requirement .github/requirements/test.txt
      - name: Install optional native SSH handshake fixture
        if: matrix.os != 'windows-latest' && matrix.python == '3.13'
        run: python -m pip install --requirement .github/requirements/ssh-test.txt
      - name: Compile
        run: python -m compileall -q cc_peer.py session_peer.py tests
      - name: Generated standalone is current
        run: python tools/generate_session_peer.py --check
      - name: Core tests
        timeout-minutes: 5
        run: python -X faulthandler -m unittest discover -s tests/core -t . -v
      - name: Adapter tests
        run: python -m unittest discover -s tests/adapters -t . -v
      - name: Codex tests
        run: python -m unittest discover -s tests/codex -t . -v
      - name: Distribution source tests
        run: python -m unittest discover -s tests/distribution -t . -v
      - name: Complete default discovery contract
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m unittest discover -s tests -v

  docs:
    name: documentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests/docs -t . -v

  package:
    name: wheel and sdist (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --requirement .github/requirements/build.txt
      - run: python tools/generate_session_peer.py --check
      - run: python -m build
      - name: Verify distribution contents
        env:
          SESSION_PEER_DIST_DIR: dist
        run: python -m unittest discover -s tests/distribution -t . -v
      - name: Install wheel and sdist independently
        shell: bash
        run: |
          expected=$(python -c 'import session_peer; print(session_peer.__version__)')
          for kind in wheel sdist; do
            venv="$RUNNER_TEMP/session-peer-package-$kind"
            python -m venv "$venv"
            if test "$kind" = wheel; then
              "$venv/bin/python" -m pip install dist/*.whl
            else
              "$venv/bin/python" -m pip install dist/*.tar.gz
            fi
            test "$("$venv/bin/python" -I -c 'import pathlib, session_peer, sysconfig; pathlib.Path(session_peer.__file__).resolve().relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve()); print(session_peer.__version__)')" = "$expected"
            test "$("$venv/bin/session-peer" --version)" = "session-peer $expected"
            "$venv/bin/session-peer" --help
            "$venv/bin/python" -m pip check
          done
          "$RUNNER_TEMP/session-peer-package-wheel/bin/session-peer" update --json

  shell:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # SC2016 (no expansion in single quotes) is the point: the heredoc we
        # pipe to ssh must reach the remote shell with $HOME intact.
        # SC1007 misreads `CDPATH= cd -- ...`, which is the standard guard
        # against cd printing a path, not an empty assignment.
        run: shellcheck --shell=sh --exclude=SC2016,SC1007 install.sh

  install-smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Fresh install from the trusted candidate checkout
        # This tests installer mechanics, not published release attestation.
        # The production default still requires verified immutable Latest assets.
        run: ./install.sh --local-source
      - name: Verify installation
        run: |
          test -f "$HOME/.local/share/session-peer/session_peer.py"
          test -L "$HOME/.local/bin/session-peer"
          test -f "$HOME/.claude/skills/session-peer/SKILL.md"
          test -f "$HOME/.agents/skills/session-peer/SKILL.md"
          "$HOME/.local/bin/session-peer" --version
      - name: Re-run the trusted candidate installer upgrades existing install
        run: |
          sed -i 's/__version__ = .*/__version__ = "0.0.1"/' "$HOME/.local/share/session-peer/session_peer.py"
          ./install.sh --local-source
          version=$("$HOME/.local/bin/session-peer" --version)
          echo "$version"
          echo "$version" | grep -qvF "0.0.1"
      - name: Uninstall
        run: |
          ./install.sh --uninstall
          test ! -d "$HOME/.claude/skills/session-peer"
          test ! -d "$HOME/.agents/skills/session-peer"
          test ! -L "$HOME/.local/bin/session-peer"

  mcp:
    name: optional MCP (${{ matrix.os }}, python ${{ matrix.python }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
        profile: [minimum, latest1, minimum2, latest2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install separate build and audit tooling
        run: python -m pip install --requirement .github/requirements/build.txt --requirement .github/requirements/audit.txt
      - name: Install MCP runtime profile
        id: mcp_runtime
        shell: bash
        env:
          MCP_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p mcp-reports
          python -m venv "$RUNNER_TEMP/session-peer-mcp-runtime"
          runtime="$RUNNER_TEMP/session-peer-mcp-runtime/bin/python"
          "$runtime" -m pip install --upgrade pip setuptools
          case "$MCP_PROFILE" in
            minimum) constraint=.github/requirements/mcp-minimum.txt ;;
            minimum2) constraint=.github/requirements/mcp-minimum2.txt ;;
            latest1) constraint=.github/requirements/mcp-latest1.txt ;;
            latest2) constraint=.github/requirements/mcp-latest2.txt ;;
            *) exit 1 ;;
          esac
          if test "$MCP_PROFILE" = minimum || test "$MCP_PROFILE" = minimum2; then
            "$runtime" -m pip install '.[mcp]' --constraint "$constraint" --report mcp-reports/install.json
          else
            "$runtime" -m pip install --upgrade '.[mcp]' --constraint "$constraint" --report mcp-reports/install.json
          fi
          "$runtime" -m pip check
      - name: Record and verify resolved MCP profile
        id: mcp_profile
        shell: bash
        env:
          MCP_PROFILE: ${{ matrix.profile }}
        run: |
          runtime="$RUNNER_TEMP/session-peer-mcp-runtime/bin/python"
          "$runtime" -m pip list --format=json > mcp-reports/runtime.json
          "$runtime" -m pip freeze --all > mcp-reports/runtime.txt
          "$runtime" - <<'PY' | tee mcp-reports/profile.json
          import importlib.metadata as metadata
          import json, os, re, sys
          from pathlib import Path
          import mcp
          pins = [line for line in Path('.github/requirements/mcp-minimum.txt').read_text().splitlines() if line and not line.startswith('#')]
          if len(pins) != 1 or not re.fullmatch(r'mcp==[0-9]+\.[0-9]+\.[0-9]+', pins[0]):
              raise SystemExit('Invalid MCP minimum constraint')
          minimum = pins[0].removeprefix('mcp==')
          pins2 = [line for line in Path('.github/requirements/mcp-minimum2.txt').read_text().splitlines() if line and not line.startswith('#')]
          if len(pins2) != 1 or not re.fullmatch(r'mcp==[0-9]+\.[0-9]+\.[0-9]+', pins2[0]):
              raise SystemExit('Invalid MCP 2 minimum constraint')
          minimum2 = pins2[0].removeprefix('mcp==')
          version = metadata.version('mcp')
          profile = os.environ['MCP_PROFILE']
          # Match the startup guard without importing optional runtime code.
          stable = re.fullmatch(r'v?(?:0!)?([0-9]+(?:\.[0-9]+)*)(?:(?:[-_.]?(?:post|rev|r)[-_.]?[0-9]*)|(?:-[0-9]+))?(?:\+[a-z0-9]+(?:[-_.][a-z0-9]+)*)?', version.strip(), re.IGNORECASE)
          release = tuple(map(int, stable.group(1).split('.'))) if stable else ()
          release += (0,) * max(0, 3 - len(release)) if release else ()
          if not {'minimum': version == minimum, 'minimum2': version == minimum2,
                  'latest1': bool(release) and release[0] == 1 and release >= (1, 30, 0),
                  'latest2': bool(release) and release[0] == 2 and release >= (2, 3, 0)}.get(profile, False):
              raise SystemExit('MCP profile version mismatch')
          print(json.dumps({'profile': profile, 'mcp': version, 'python': sys.version, 'platform': sys.platform}))
          PY
      - name: Install isolated opposite-major negotiation client
        id: mcp_client
        shell: bash
        env:
          MCP_PROFILE: ${{ matrix.profile }}
        run: |
          python -m venv "$RUNNER_TEMP/session-peer-mcp-client"
          client="$RUNNER_TEMP/session-peer-mcp-client/bin/python"
          "$client" -m pip install --upgrade pip setuptools
          case "$MCP_PROFILE" in
            minimum2) requirement='mcp==1.30.0' ;;
            latest2) requirement='mcp>=1.30,<2' ;;
            minimum|latest1) requirement='mcp>=2.3,<3' ;;
            *) exit 1 ;;
          esac
          "$client" -m pip install "$requirement" --report mcp-reports/client-install.json
          "$client" -m pip check
          "$client" -m pip list --format=json > mcp-reports/client-runtime.json
      - name: MCP stdio, policy, timeout and owned-child cleanup
        shell: bash
        env:
          SESSION_PEER_MCP_CLIENT_PYTHON: ${{ runner.temp }}/session-peer-mcp-client/bin/python
          SESSION_PEER_MCP_REQUIRE_CLIENT: '1'
          SESSION_PEER_TEST_TMP: /tmp
        run: '"$RUNNER_TEMP/session-peer-mcp-runtime/bin/python" -m unittest discover -s tests/mcp_integration -t . -v'
      - name: Audit resolved MCP runtime graph
        if: ${{ !cancelled() && steps.mcp_runtime.outcome == 'success' && steps.mcp_profile.outcome == 'success' }}
        shell: bash
        run: |
          audit_path=$("$RUNNER_TEMP/session-peer-mcp-runtime/bin/python" -I -c 'import site; print(site.getsitepackages()[0])')
          set +e
          python -m pip_audit --path "$audit_path" --format=json --output mcp-reports/audit.json 2> mcp-reports/audit.log
          audit_status=$?
          set -e
          echo "$audit_status" > mcp-reports/audit-exit-status.txt
          cat mcp-reports/audit.log >&2
          exit "$audit_status"
      - name: Audit isolated MCP client runtime graph
        if: ${{ !cancelled() && steps.mcp_client.outcome == 'success' }}
        shell: bash
        run: |
          audit_path=$("$RUNNER_TEMP/session-peer-mcp-client/bin/python" -I -c 'import site; print(site.getsitepackages()[0])')
          set +e
          python -m pip_audit --path "$audit_path" --format=json --output mcp-reports/client-audit.json 2> mcp-reports/client-audit.log
          audit_status=$?
          set -e
          echo "$audit_status" > mcp-reports/client-audit-exit-status.txt
          cat mcp-reports/client-audit.log >&2
          exit "$audit_status"
      - name: Retain MCP dependency and audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}
          path: mcp-reports/
          if-no-files-found: error
          retention-days: 30
      - run: python -m build
      - name: Verify optional module in distributions
        run: |
          python -c 'import glob,zipfile; z=zipfile.ZipFile(glob.glob("dist/*.whl")[0]); assert "session_peer_mcp.py" in z.namelist()'

  relay:
    name: optional relay (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[relay,mcp]' --requirement .github/requirements/build.txt
      # Preserve Python stacks if a native dependency/process segfaults;
      # this is diagnostic only, not a workaround for an unexplained crash.
      - run: python -X faulthandler -m unittest discover -s tests/relay -t . -v
      - run: python -m build
      - name: Verify optional transport packaging
        env:
          SESSION_PEER_DIST_DIR: dist
        run: python -m unittest tests.distribution.test_distribution_contents -v
      - name: Optional management CLI smoke
        run: |
          session-peer device --help
          session-peer relay --help

  dependency-audit:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement .github/requirements/audit.txt
      - name: Install only runtime dependencies in an isolated environment
        run: |
          python -m venv /tmp/session-peer-runtime-audit
          /tmp/session-peer-runtime-audit/bin/pip install '.[relay,mcp]'
      - name: Audit installed Python runtime dependencies
        run: |
          audit_path=$(/tmp/session-peer-runtime-audit/bin/python -I -c 'import site; print(site.getsitepackages()[0])')
          python -m pip_audit --path "$audit_path"

  release-gate:
    name: release gate
    if: ${{ always() }}
    needs: [relay-control, test, docs, package, shell, install-smoke, mcp, relay, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-critical job
        env:
          RELAY_CONTROL: ${{ needs.relay-control.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          PACKAGE: ${{ needs.package.result }}
          SHELL: ${{ needs.shell.result }}
          INSTALL_SMOKE: ${{ needs.install-smoke.result }}
          MCP: ${{ needs.mcp.result }}
          RELAY: ${{ needs.relay.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          for result in "$RELAY_CONTROL" "$TEST" "$DOCS" "$PACKAGE" "$SHELL" \
            "$INSTALL_SMOKE" "$MCP" "$RELAY" "$DEPENDENCY_AUDIT"; do
            test "$result" = success
          done

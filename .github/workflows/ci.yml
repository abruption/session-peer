name: ci

on:
  push:
    branches: [main, release/0.9.x]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises; macOS is half the fleet.
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q cc_peer.py session_peer.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement .github/requirements/build.txt
      - run: python -m build
      - name: Verify exact distribution contents
        env:
          SESSION_PEER_DIST_DIR: dist
        run: python -m unittest tests.test_distribution_contents -v
      - name: Rebuild and verify immutable candidate evidence
        run: |
          python -m build --outdir rebuilt
          version=$(python .github/scripts/release_artifacts.py version)
          python .github/scripts/release_artifacts.py compare --first dist --second rebuilt --version "$version"
          python .github/scripts/release_artifacts.py verify-artifacts --dist dist --version "$version" --write-manifest
          python .github/scripts/release_artifacts.py verify-manifest --dist dist --version "$version"
      - name: Install wheel and sdist independently
        run: |
          python -m venv /tmp/session-peer-wheel
          /tmp/session-peer-wheel/bin/pip install dist/*.whl
          /tmp/session-peer-wheel/bin/session-peer --version
          /tmp/session-peer-wheel/bin/session-peer update --json
          python -m venv /tmp/session-peer-sdist
          /tmp/session-peer-sdist/bin/pip install dist/*.tar.gz
          /tmp/session-peer-sdist/bin/session-peer --version

  shell:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: shellcheck
        # SC2016 (no expansion in single quotes) is the point: the heredoc we
        # pipe to ssh must reach the remote shell with $HOME intact.
        # SC1007 misreads `CDPATH= cd -- ...`, which is the standard guard
        # against cd printing a path, not an empty assignment.
        run: shellcheck --shell=sh --exclude=SC2016,SC1007 install.sh

  install-smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Fresh install
        run: ./install.sh
      - name: Verify installation
        run: |
          test -f "$HOME/.local/share/session-peer/session_peer.py"
          test -L "$HOME/.local/bin/session-peer"
          "$HOME/.local/bin/session-peer" --version
      - name: Re-run upgrades existing install
        run: |
          sed -i 's/__version__ = .*/__version__ = "0.0.1"/' "$HOME/.local/share/session-peer/session_peer.py"
          ./install.sh
          version=$("$HOME/.local/bin/session-peer" --version)
          echo "$version"
          echo "$version" | grep -qv "0.0.1"
      - name: Uninstall
        run: |
          ./install.sh --uninstall
          test ! -d "$HOME/.claude/skills/session-peer"
          test ! -L "$HOME/.local/bin/session-peer"

  mcp:
    name: optional MCP (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[mcp]' --requirement .github/requirements/build.txt
      - run: python -m unittest tests.test_mcp -v
      - run: python -m build
      - name: Verify optional module in distributions
        run: |
          python -c 'import glob,zipfile; z=zipfile.ZipFile(glob.glob("dist/*.whl")[0]); assert "session_peer_mcp.py" in z.namelist()'

  relay:
    name: optional relay (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[relay,mcp]' --requirement .github/requirements/build.txt
      - run: python -m unittest tests.test_native_relay tests.test_relay69 -v
      - run: python -m build
      - name: Verify optional transport packaging
        run: |
          python -c 'import glob,zipfile; z=zipfile.ZipFile(glob.glob("dist/*.whl")[0]); assert "session_peer_relay/cli.py" in z.namelist(); assert not any(n.startswith("experiments/") for n in z.namelist())'
          python -c 'import glob,tarfile; t=tarfile.open(glob.glob("dist/*.tar.gz")[0]); assert not any("/experiments/" in n for n in t.getnames())'
      - name: Optional management CLI smoke
        run: |
          session-peer device --help
          session-peer relay --help
  dependency-audit:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement .github/requirements/audit.txt
      - name: Audit isolated runtime dependencies
        run: |
          python -m venv /tmp/session-peer-maintenance-audit
          /tmp/session-peer-maintenance-audit/bin/pip install '.[relay,mcp]'
          audit_path=$(/tmp/session-peer-maintenance-audit/bin/python -c 'import site; print(site.getsitepackages()[0])')
          python -m pip_audit --path "$audit_path"

  release-gate:
    name: release gate
    if: ${{ always() }}
    needs: [test, package, shell, install-smoke, mcp, relay, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-critical job
        env:
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
          SHELL: ${{ needs.shell.result }}
          INSTALL_SMOKE: ${{ needs.install-smoke.result }}
          MCP: ${{ needs.mcp.result }}
          RELAY: ${{ needs.relay.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          for result in "$TEST" "$PACKAGE" "$SHELL" "$INSTALL_SMOKE" "$MCP" "$RELAY" "$DEPENDENCY_AUDIT"; do
            test "$result" = success
          done

name: node-cli-experiment
on:
  pull_request:
    paths:
      - 'experiments/node-cli/**'
      - 'session_peer.py'
      - 'tests/fixtures/compatibility-v1.json'
      - '.github/workflows/node-cli-experiment.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/node-cli/**'
      - 'session_peer.py'
      - 'tests/fixtures/compatibility-v1.json'
      - '.github/workflows/node-cli-experiment.yml'
permissions:
  contents: read
jobs:
  conformance:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/node-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: experiments/node-cli/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:package

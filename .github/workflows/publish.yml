name: publish to PyPI

on:
  release:
    types: [published]

# Grant each job only what it needs. PyPI authentication remains OIDC-only.
permissions: {}

jobs:
  build:
    name: verify already locked release artifacts
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require owner publication (fail rather than silently skip)
        run: |
          if [ "$GITHUB_REPOSITORY" != abruption/session-peer ] || [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo '::error::Release publication requires the repository owner.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned build tooling
        run: python -m pip install --requirement .github/requirements/build.txt
      - name: Fetch the protected main reference
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify generated standalone source
        run: python tools/generate_session_peer.py --check
      - name: Verify release tag, target, commit, and protected-main ancestry
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version=$(python .github/scripts/release_artifacts.py verify-source \
            --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --expected-sha "$RELEASE_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download the exact immutable attested release assets (never rebuild or mutate)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The API check in this verifier fails on nonimmutable releases even
          # when the event payload omits the immutable field.
          python .github/scripts/download_release.py --tag "$RELEASE_TAG" --expected-sha "$GITHUB_SHA" --output dist
          python .github/scripts/release_artifacts.py verify-standalone --dist dist
          python .github/scripts/release_artifacts.py verify-manifest --dist dist --version "${{ steps.source.outputs.version }}"
      - name: Preserve verified publisher inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  test-wheel:
    name: install release wheel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.event.release.tag_name }}
          path: dist/
      - name: Verify and install only the wheel
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python .github/scripts/release_artifacts.py verify-manifest \
            --dist dist --version "$RELEASE_VERSION"
          python -m venv /tmp/session-peer-release-wheel
          /tmp/session-peer-release-wheel/bin/pip install --no-deps dist/*.whl
          test "$(/tmp/session-peer-release-wheel/bin/python -I -c 'import pathlib, session_peer, sysconfig; pathlib.Path(session_peer.__file__).resolve().relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve()); print(session_peer.__version__)')" = "$RELEASE_VERSION"
          test "$(/tmp/session-peer-release-wheel/bin/session-peer --version)" = "session-peer $RELEASE_VERSION"
          /tmp/session-peer-release-wheel/bin/session-peer --help

  test-sdist:
    name: install release sdist
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.event.release.tag_name }}
          path: dist/
      - name: Verify and install only the sdist
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python .github/scripts/release_artifacts.py verify-manifest \
            --dist dist --version "$RELEASE_VERSION"
          python -m venv /tmp/session-peer-release-sdist
          /tmp/session-peer-release-sdist/bin/pip install --no-deps dist/*.tar.gz
          test "$(/tmp/session-peer-release-sdist/bin/python -I -c 'import pathlib, session_peer, sysconfig; pathlib.Path(session_peer.__file__).resolve().relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve()); print(session_peer.__version__)')" = "$RELEASE_VERSION"
          test "$(/tmp/session-peer-release-sdist/bin/session-peer --version)" = "session-peer $RELEASE_VERSION"
          /tmp/session-peer-release-sdist/bin/session-peer --help

  dependency-audit:
    name: release dependency audits
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control/package-lock.json
      - run: python -m pip install --requirement .github/requirements/audit.txt
      - name: Audit Python runtime dependencies
        run: |
          python -m venv /tmp/session-peer-release-audit
          /tmp/session-peer-release-audit/bin/pip install '.[relay,mcp]'
          audit_path=$(/tmp/session-peer-release-audit/bin/python -I -c 'import site; print(site.getsitepackages()[0])')
          python -m pip_audit --path "$audit_path"
      - name: Audit Node runtime dependencies
        working-directory: control
        run: |
          npm ci
          npm audit --omit=dev

  publish:
    name: publish with PyPI Trusted Publishing
    needs: [build, test-wheel, test-sdist, dependency-audit]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.event.release.tag_name }}
          path: dist/
      - name: Reverify the exact files handed to the publisher
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python .github/scripts/release_artifacts.py verify-manifest --dist dist --version "$RELEASE_VERSION"
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
          python .github/scripts/release_artifacts.py compare \
            --first dist --second publish --version "$RELEASE_VERSION"
      - name: Publish immutable files and PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: publish/
          skip-existing: false
          verify-metadata: true

  verify-pypi:
    name: verify published PyPI artifacts
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.event.release.tag_name }}
          path: expected/
      - name: Download and match the PyPI file set and hashes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python .github/scripts/release_artifacts.py download-pypi \
            --expected expected --output pypi --version "$RELEASE_VERSION"
          python .github/scripts/release_artifacts.py compare \
            --first expected --second pypi --version "$RELEASE_VERSION"
      - name: Independently install the downloaded wheel and sdist
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/session-peer-pypi-wheel
          /tmp/session-peer-pypi-wheel/bin/pip install --no-deps pypi/*.whl
          test "$(/tmp/session-peer-pypi-wheel/bin/python -I -c 'import pathlib, session_peer, sysconfig; pathlib.Path(session_peer.__file__).resolve().relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve()); print(session_peer.__version__)')" = "$RELEASE_VERSION"
          test "$(/tmp/session-peer-pypi-wheel/bin/session-peer --version)" = "session-peer $RELEASE_VERSION"
          /tmp/session-peer-pypi-wheel/bin/session-peer --help
          python -m venv /tmp/session-peer-pypi-sdist
          /tmp/session-peer-pypi-sdist/bin/pip install --no-deps pypi/*.tar.gz
          test "$(/tmp/session-peer-pypi-sdist/bin/python -I -c 'import pathlib, session_peer, sysconfig; pathlib.Path(session_peer.__file__).resolve().relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve()); print(session_peer.__version__)')" = "$RELEASE_VERSION"
          test "$(/tmp/session-peer-pypi-sdist/bin/session-peer --version)" = "session-peer $RELEASE_VERSION"
          /tmp/session-peer-pypi-sdist/bin/session-peer --help
      - name: Preserve post-publication verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-verification-${{ github.event.release.tag_name }}
          path: |
            expected/SHA256SUMS
            expected/release-provenance.json
            pypi/*.whl
            pypi/*.tar.gz
          if-no-files-found: warn
          retention-days: 90

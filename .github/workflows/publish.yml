name: publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Verify release version and transport artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import glob, os, zipfile
          from packaging.version import Version
          import session_peer
          assert Version(os.environ["RELEASE_TAG"].removeprefix("v")) == Version(session_peer.__version__)
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              assert "session_peer_relay/cli.py" in wheel.namelist()
              assert "cc_peer.py" not in wheel.namelist()
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

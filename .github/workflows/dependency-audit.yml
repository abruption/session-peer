name: scheduled dependency audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install audit tooling
        run: python -m pip install --requirement .github/requirements/audit.txt
      - name: Install only runtime dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/session-peer-runtime-audit"
          "$RUNNER_TEMP/session-peer-runtime-audit/bin/pip" install '.[relay,mcp]'
      - name: Audit Python runtime dependencies
        id: audit
        run: |
          mkdir -p audit-reports
          audit_path=$("$RUNNER_TEMP/session-peer-runtime-audit/bin/python" -c 'import site; print(site.getsitepackages()[0])')
          set +e
          python -m pip_audit --path "$audit_path" --format=json --output audit-reports/python.json 2> audit-reports/python.log
          audit_status=$?
          set -e
          echo "$audit_status" > audit-reports/exit-status.txt
          exit "$audit_status"
      - name: Summarize Python audit
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          mkdir -p audit-reports
          {
            echo '## Python runtime dependency audit'
            echo "Audit step: $AUDIT_OUTCOME"
            if test -f audit-reports/exit-status.txt; then
              echo "Exit status: $(cat audit-reports/exit-status.txt)"
            else
              echo 'Audit did not complete; inspect the setup steps.'
            fi
            for report in audit-reports/python.json audit-reports/python.log; do
              if test -s "$report"; then
                echo
                echo "### $report"
                echo '```'
                cat "$report"
                echo
                echo '```'
              fi
            done
          } > audit-reports/summary.md
          cat audit-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Python audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-runtime-audit
          path: audit-reports/
          if-no-files-found: error
          retention-days: 30

  node-runtime:
    name: Node runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install control dependencies
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Audit Node runtime dependencies
        id: audit
        working-directory: control
        run: |
          mkdir -p ../audit-reports
          set +e
          npm audit --omit=dev --json > ../audit-reports/node.json 2> ../audit-reports/node.log
          audit_status=$?
          set -e
          echo "$audit_status" > ../audit-reports/exit-status.txt
          exit "$audit_status"
      - name: Summarize Node audit
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          mkdir -p audit-reports
          {
            echo '## Node runtime dependency audit'
            echo "Audit step: $AUDIT_OUTCOME"
            if test -f audit-reports/exit-status.txt; then
              echo "Exit status: $(cat audit-reports/exit-status.txt)"
            else
              echo 'Audit did not complete; inspect the setup steps.'
            fi
            for report in audit-reports/node.json audit-reports/node.log; do
              if test -s "$report"; then
                echo
                echo "### $report"
                echo '```'
                cat "$report"
                echo
                echo '```'
              fi
            done
          } > audit-reports/summary.md
          cat audit-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Node audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-runtime-audit
          path: audit-reports/
          if-no-files-found: error
          retention-days: 30
